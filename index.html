<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Mobile UI Mockup - Page 1</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Video Player Section (Click image to change/upload) -->
        <div class="video-player" id="videoPlayer" title="Click to change video thumbnail">
            <img src="theater_seats_cropped.jpg" alt="Video Player Frame" class="video-bg" id="videoBg">
            
            <!-- Hidden file input for uploading custom top image -->
            <input type="file" id="imageUploader" accept="image/*" style="display: none;">
            
            <!-- Hover overlay prompt -->
            <div class="upload-hint">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>Click to Change Image</span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-filled"></div>
            </div>
        </div>

        <!-- YouTube Description Bottom Sheet (Page 1) -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="drag-handle-container">
                <div class="drag-handle"></div>
            </div>
            
            <div class="sheet-header">
                <h2 class="sheet-title">Description</h2>
                <!-- Multi-Color Palette Shifter Buttons -->
                <div class="color-shifter-container">
                    <div class="color-palette">
                        <button class="palette-dot dot-default" data-color="default" title="Default (#0f0f0f)"></button>
                        <button class="palette-dot dot-gold" data-color="gold" title="Dark Gold (#22210c)"></button>
                        <button class="palette-dot dot-red" data-color="red" title="Dark Red (#220f0b)"></button>
                        <button class="palette-dot dot-gray" data-color="gray" title="Charcoal Gray (#232323)"></button>
                        <button class="palette-dot dot-navy" data-color="navy" title="Deep Navy (#0c1323)"></button>
                    </div>
                    <button class="close-btn" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Stats Grid Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value">2,548</span>
                    <span class="stat-label">Likes</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">36,412</span>
                    <span class="stat-label">Views</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">Jul 5</span>
                    <span class="stat-label">2026</span>
                </div>
            </div>

            <div class="page-nav" style="margin-top: 20px;">
                <a href="page2.html" class="nav-btn">Go to Page 2 →</a>
            </div>
        </div>
    </div>

    <!-- Scripts for image upload & multi-color shifter -->
    <script>
        // Image Upload Script
        const videoPlayer = document.getElementById('videoPlayer');
        const videoBg = document.getElementById('videoBg');
        const imageUploader = document.getElementById('imageUploader');

        videoPlayer.addEventListener('click', () => {
            imageUploader.click();
        });

        imageUploader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    videoBg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Multi-Color Shifter Script (#0f0f0f, #22210c, #220f0b, #232323, #0c1323)
        const bottomSheet = document.getElementById('bottomSheet');
        const dots = document.querySelectorAll('.palette-dot');

        function applyColorMode(mode) {
            bottomSheet.classList.remove('mode-gold', 'mode-red', 'mode-gray', 'mode-navy');
            dots.forEach(d => d.classList.remove('active'));
            if (mode && mode !== 'default') {
                bottomSheet.classList.add('mode-' + mode);
            }
            const activeDot = document.querySelector(`.palette-dot[data-color="${mode || 'default'}"]`);
            if (activeDot) activeDot.classList.add('active');
        }

        const savedColor = localStorage.getItem('descriptionColorMode') || 'default';
        applyColorMode(savedColor);

        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                const selectedColor = dot.getAttribute('data-color');
                applyColorMode(selectedColor);
                localStorage.setItem('descriptionColorMode', selectedColor);
            });
        });
    </script>
</body>
</html>
