<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Comment Clone - Page 3</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .comment-thread {
            display: flex;
            width: 100%;
            background-color: transparent;
            margin-top: 10px;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 24px;
            margin-right: 10px;
            position: relative;
            padding-top: 0px;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            display: block;
            margin-left: 0;
        }

        /* The curved line connecting the avatar to the reply */
        .reply-curve {
            position: absolute;
            top: 24px; /* Starts right at the bottom of the 24px avatar */
            height: 102px; /* Longer thread line height */
            left: 11px; /* Centered under the 24px avatar */
            width: 23px; /* Extends outward to the right */
            border-left: 1.5px solid #383838;
            border-bottom: 1.5px solid #383838;
            border-bottom-left-radius: 16px; /* Proper round curve arc */
            z-index: 1;
        }

        .right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            min-height: 20px;
            width: 100%;
        }

        .header .username {
            font-size: 10px;
            font-weight: 400;
            color: #aaaaaa;
        }

        .header .dot {
            font-size: 8px;
            font-weight: 400;
            color: #aaaaaa;
            margin: 0 3px;
        }

        .header .time {
            font-size: 10px;
            font-weight: 400;
            color: #aaaaaa;
        }

        .header .options {
            margin-left: auto;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .header .options svg {
            width: 18px;
            height: 18px;
            fill: #ffffff; /* SVG white */
        }

        .body-text {
            font-size: 12px;
            line-height: 18px;
            color: #ffffff;
            margin-bottom: 12px;
            width: 100%;
        }

        .timestamp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0px 3px;
            height: 16px;
            line-height: 16px;
            background-color: #263850;
            color: #3ea6ff;
            border-radius: 0px; /* No round corners */
            text-decoration: none;
            font-weight: 400;
            font-size: 12px; /* Same text size as comment body */
            margin-right: 4px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            color: #ffffff; /* SVG / text white */
            padding: 0;
            cursor: pointer;
            font-family: inherit;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff; /* SVG white */
        }

        .action-btn .count {
            color: #ffffff;
            font-size: 12px;
            margin-left: 2px; /* Push count closer to the left towards like image */
            font-weight: 400;
        }

        .reply-section {
            display: flex;
            align-items: center;
            height: 20px;
            margin-top: 3px;
            cursor: pointer;
        }

        .reply-text {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .reply-text svg {
            width: 24px;
            height: 24px;
            fill: #ffffff; /* SVG white */
            margin-top: 1px; /* Align chevron arrow slightly lower */
            margin-left: -2px; /* Push chevron arrow closer to the left */
        }
    </style>
</head>
<body class="comments-page">
    <div class="mobile-container">
        <!-- Video Player Section (Click image to change/upload) -->
        <div class="video-player" id="videoPlayer" title="Click to change video thumbnail">
            <img src="theater_seats_cropped.jpg" alt="Video Player Frame" class="video-bg" id="videoBg">
            
            <!-- Hidden file input for uploading custom top image -->
            <input type="file" id="imageUploader" accept="image/*" style="display: none;">
            
            <!-- Hover overlay prompt -->
            <div class="upload-hint">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>Click to Change Image</span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-filled" style="width: 66%;"></div>
            </div>
        </div>

        <!-- YouTube Comments Bottom Sheet (Page 3 View) -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="drag-handle-container" style="padding-top: 4px; padding-bottom: 2px;">
                <div class="drag-handle"></div>
            </div>

            <!-- Header Title Bar (Comments + Info Icon + Close Icon) -->
            <div class="comments-top-bar" style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0px 4px 0px; width: 100%; margin-bottom: 10px;">
                <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; margin: 0; padding-left: 0;">Comments</h2>
                <div style="display: flex; align-items: center; gap: 16px; margin-right: 0;">
                    <!-- Info Icon (i inside circle) -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <!-- Close Icon (X) -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>

            <!-- Filter Chips (Top / Newest) -->
            <div class="comments-filter-chips" style="display: flex; gap: 8px; padding: 4px 16px 8px 16px; margin: 0 -16px; border-bottom: 1px solid #383838; width: calc(100% + 32px); box-sizing: border-box;">
                <button style="background: #f1f1f1; color: #0f0f0f; border: none; border-radius: 5px; width: 45px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;">Top</button>
                <button style="background: #272727; color: #ffffff; border: none; border-radius: 5px; width: 65px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;">Newest</button>
            </div>

            <!-- Comments Content Section -->
            <div class="description-body" style="padding: 10px 0px 20px 0px; width: 100%;">
                <div class="comment-thread">
                    <div class="left-col">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAteTAwshviEtRKCytxgdfHNMEsSILL9sULJuPlKlkSxQuHijRVUBLeAx8&s=10" alt="User avatar" class="avatar">
                        <div class="reply-curve"></div>
                    </div>
                    
                    <div class="right-col">
                        <!-- Header Row -->
                        <div class="header">
                            <span class="username">@pavangowd_a21</span>
                            <span class="dot">•</span>
                            <span class="time">1w ago</span>
                            <div class="options" title="More options">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                    <path d="M12 16.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zM12 10.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zM12 4.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5z"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- Comment Body -->
                        <div class="body-text">
                            <a href="#" class="timestamp">2:06</a><span> The director seems to be a fanboy of Wong Kar Wai loved the subtle Fallen Angels homage</span>
                        </div>

                        <!-- Action Bar -->
                        <div class="actions">
                            <!-- Like Button -->
                            <button class="action-btn" title="Like">
                                <img src="asset/Thumbsup.png" alt="Like" style="width: 24px; height: 24px; object-fit: contain;">
                                <span class="count">5</span>
                            </button>
                            <!-- Dislike Button -->
                            <button class="action-btn" title="Dislike">
                                <img src="asset/Thumbsup.png" alt="Dislike" style="width: 24px; height: 24px; object-fit: contain; transform: rotate(180deg);">
                            </button>
                            <!-- Comment / Reply Bubble -->
                            <button class="action-btn" title="Comment">
                                <img src="asset/comment.png" alt="Comment" style="width: 24px; height: 24px; object-fit: contain;">
                            </button>
                        </div>

                        <!-- Reply Section -->
                        <div class="reply-section">
                            <span class="reply-text">
                                2 reply 
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <path d="M12 15.1l-6-6 1-1L12 13.1l5-5 1 1z" transform="rotate(-90 12 12)"></path>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Page Navigation and Color Shifter Toggle Container -->
                <div class="page-nav" style="margin-top: 25px;">
                    <div class="color-palette-nav">
                        <button class="palette-dot dot-default" data-color="default" title="Default (#0f0f0f)"></button>
                        <button class="palette-dot dot-gold" data-color="gold" title="Dark Gold (#22210c)"></button>
                        <button class="palette-dot dot-red" data-color="red" title="Dark Red (#220f0b)"></button>
                        <button class="palette-dot dot-burgundy" data-color="burgundy" title="Dark Burgundy (#32141c)"></button>
                        <button class="palette-dot dot-teal" data-color="teal" title="Dark Teal (#0c2122)"></button>
                        <button class="palette-dot dot-navy" data-color="navy" title="Deep Navy (#0c1323)"></button>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <a href="page2.html" class="nav-btn">← Page 2</a>
                        <a href="index.html" class="nav-btn">Page 1 →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts for image upload & page 3 background color shifter -->
    <script>
        // Image Upload Script
        const videoPlayer = document.getElementById('videoPlayer');
        const videoBg = document.getElementById('videoBg');
        const imageUploader = document.getElementById('imageUploader');

        videoPlayer.addEventListener('click', () => {
            imageUploader.click();
        });

        imageUploader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    videoBg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Page 3 Background Color Shifter Script
        const bottomSheet = document.getElementById('bottomSheet');
        const dots = document.querySelectorAll('.palette-dot');

        function applySheetColor(mode) {
            bottomSheet.classList.remove('sheet-gold', 'sheet-red', 'sheet-burgundy', 'sheet-teal', 'sheet-navy');
            if (mode && mode !== 'default') {
                bottomSheet.classList.add('sheet-' + mode);
            }
            dots.forEach(d => d.classList.remove('active'));
            const activeDot = document.querySelector(`.palette-dot[data-color="${mode || 'default'}"]`);
            if (activeDot) activeDot.classList.add('active');
        }

        const savedSheetColor = localStorage.getItem('page3SheetColorMode') || 'default';
        applySheetColor(savedSheetColor);

        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                const selectedColor = dot.getAttribute('data-color');
                applySheetColor(selectedColor);
                localStorage.setItem('page3SheetColorMode', selectedColor);
            });
        });
    </script>
</body>
</html>
